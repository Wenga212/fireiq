name: Rebuild Firewall Data

on:
  push:
    paths:
      - 'datasheets/**'
      - 'scripts/build.py'
  workflow_dispatch:

# Prevent overlapping runs from racing each other to push.
# Queued runs wait for the current one to finish instead of colliding.
concurrency:
  group: rebuild-firewall-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build firewalls.json from datasheets
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/firewalls.json data/sources-status.json
          if git diff --staged --quiet; then
            echo "No data changes - nothing to commit"
          else
            git commit -m "chore(data): rebuild $(date -u +%Y-%m-%d) from datasheets/"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "Pushed on attempt $attempt"
                exit 0
              fi
              echo "Push attempt $attempt failed - remote moved, retrying in 5s..."
              sleep 5
            done
            echo "::error::Could not push after 5 attempts"
            exit 1
          fi
