name: Rebuild Firewall Data

on:
  push:
    paths:
      - 'datasheets/**'
      - 'scripts/build.py'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build firewalls.json from datasheets
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/firewalls.json data/sources-status.json
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit"
          else
            git commit -m "chore(data): rebuild $(date -u +%Y-%m-%d) from datasheets/"
            git push
          fi
